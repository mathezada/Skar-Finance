<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skar Finance - Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<section id="app" class="hide"></section>
<div id="modal"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="dashboard.js"></script>
<script>
/* Abre o dashboard somente para usuários autenticados no Supabase. */
window.aoSair=function(){location.href='index.html'};
(async function(){
  if(!window.skarSupabase){ location.href='index.html'; return; }
  const {data:{session}}=await window.skarSupabase.auth.getSession();
  if(!session?.user){ location.href='index.html'; return; }
  const user=session.user;
  await abrirDashboard({
    id:user.id,
    email:user.email,
    name:user.user_metadata?.full_name||user.email.split('@')[0]
  });
})();
</script>
</body>
</html>
